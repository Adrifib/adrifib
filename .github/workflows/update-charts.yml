name: Update activity charts

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate.py]

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # With the default token the language chart would only see public repos,
      # so it is regenerated only when a PROFILE_TOKEN secret (a PAT that can
      # read your repos) exists; otherwise the previous chart is kept.
      - name: Generate charts
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          LANGS: ${{ secrets.PROFILE_TOKEN != '' && 'always' || 'never' }}
        run: python3 scripts/generate.py --login "${{ github.repository_owner }}" --out assets --languages "$LANGS"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update activity charts" && git push
